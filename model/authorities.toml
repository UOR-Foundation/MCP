# model/authorities.toml --- what this repository cites rather than proves.
#
# A `some-true` claim is reproduced from an authority and is not established
# here. This file is where the authority is named well enough for a third party
# to find it, with a checksum over the committed artifact when there is one and
# a stated reason when there is not.
#
# `realized_by` lists the conformance IDs that are *evidence* this repository
# realizes the cited fact. Evidence is not proof, and the meta-gate fails the
# build if any document blurs the two registers.
#
# The JSON text codec cites the two standards it implements and the corpus it is
# measured against. The stateless lifecycle cites the specification revision it
# implements, the two HTTP and Base64 standards its header rules rest on, and the
# conformance suite whose scenarios its test vectors are taken from.

spec = "template/1"

authority = [
  { id = "A-RFC8259", name = "RFC 8259: The JavaScript Object Notation (JSON) Data Interchange Format", citation = "T. Bray (ed.), RFC 8259 (STD 90), December 2017, https://www.rfc-editor.org/rfc/rfc8259", checksum = "none", checksum_reason = "A published standard; no copy of it is committed here, so there is no artifact to checksum.", statement = "The grammar of a JSON text: whitespace, the three literals, numbers, strings with escapes and surrogate pairs, arrays and objects; a JSON text is UTF-8.", realized_by = ["JC-03", "JC-04", "JC-06", "JC-07"] },
  { id = "A-RFC3629", name = "RFC 3629: UTF-8, a transformation format of ISO 10646", citation = "F. Yergeau, RFC 3629 (STD 63), November 2003, section 4 syntax and Table 3-7 of the Unicode Standard, https://www.rfc-editor.org/rfc/rfc3629", checksum = "none", checksum_reason = "A published standard; no copy of it is committed here, so there is no artifact to checksum.", statement = "Well-formed UTF-8 forbids overlong forms, the surrogate range U+D800..U+DFFF and values above U+10FFFF.", realized_by = ["JC-01", "JC-02", "JC-14"] },
  { id = "A-JSONTESTSUITE", name = "JSONTestSuite test_parsing corpus", citation = "N. Seriot, https://github.com/nst/JSONTestSuite at commit 1ef36fa01286573e846ac449e8683f8833c5b26a, directory test_parsing (git tree b936f9acdd24b9f5fefe68b90b9beab2c681137a), MIT licence", checksum = "abc15ec8c3df7ff6fa771b051a8950012403b241af2688e82374e0bcafcdd21c", checksum_reason = "", statement = "318 files: 95 y_ must-accept, 188 n_ must-reject, 35 i_ implementation-defined. The checksum is SHA-256 over the manifest, one `<sha256 of file>  <name>` line per file in byte order of the names.", realized_by = ["JC-03", "JC-04", "JC-05", "JC-12"] },
  { id = "A-MCP-SPEC-2026-07-28", name = "Model Context Protocol specification, revision 2026-07-28", citation = "https://github.com/modelcontextprotocol/modelcontextprotocol at commit 80041ab0a139a8f4fb3adbc99f7ae9113ea59671, docs/specification/2026-07-28 (basic/lifecycle, basic/transports/streamable-http, basic/patterns/mrtr, server/tools, server/resources, server/prompts, server/utilities/completion, server/utilities/caching)", checksum = "none", checksum_reason = "A published specification; no copy of it is committed here, so there is no artifact to checksum. The commit above names the text read.", statement = "A request carries _meta with the protocol version and the client capabilities; server/discover returns the supported versions, the capabilities and, under _meta, the server identity; the HTTP status of a refusal follows its JSON-RPC code (400 for -32602, -32020, -32021 and -32022, 404 for -32601); Mcp-Method is required on every POST and Mcp-Name on tools/call, resources/read and prompts/get; Mcp-Param headers mirror annotated parameters and may be Base64-wrapped; tools/list returns the tools with name, description, inputSchema and optional outputSchema; tools/call returns content blocks (text, image, audio, resource link, embedded resource), optional structuredContent that conforms to the outputSchema, and isError; an unknown tool and a request that fails the CallToolRequest schema are JSON-RPC errors (-32602), an input validation error is a result with isError true; progress is reported with notifications/progress carrying the request's progressToken and an increasing progress; a server MUST validate tool inputs, rate limit tool invocations and sanitize tool outputs; resources/list, resources/templates/list and resources/read list and read resources and templates, a resource that does not exist MUST be refused with -32602 (Invalid Params) and an empty contents array MUST NOT be returned for it, the error data SHOULD hold the requested uri; prompts/list and prompts/get list prompts and answer messages of text, image and embedded resource content, an invalid prompt name and a missing required argument are -32602; completion/complete answers at most 100 values with an optional total and hasMore; server/discover, tools/list, prompts/list, resources/list, resources/templates/list and resources/read results with resultType complete MUST carry ttlMs, an integer that is not negative, and cacheScope, public or private; a server MUST validate the Origin header and answer one that is present and invalid with 403 Forbidden, whose body MAY be a JSON-RPC error that has no id; a request is answered with one JSON object or with an event stream scoped to it that carries related notifications before the response and is not resumable.; a server MAY answer tools/call, resources/read and prompts/get with an InputRequiredResult (resultType input_required) that carries inputRequests of ElicitRequest, CreateMessageRequest or ListRootsRequest and an opaque requestState, and MUST NOT answer any other request so; it MUST include at least one of inputRequests and requestState, MUST NOT send an inputRequest for a capability the client did not declare, and MUST treat a requestState it receives as attacker-controlled, protect its integrity when it influences behavior, and reject state that fails verification; a client retries with inputResponses and the exact requestState; a server SHOULD ask again for missing information instead of failing, SHOULD ignore inputResponses entries it does not recognize and SHOULD return a JSON-RPC error for an inputResponses object that is not valid.", realized_by = ["LC-01", "LC-02", "LC-03", "LC-04", "LC-05", "LC-06", "LC-07", "LC-08", "LC-09", "LC-10", "HH-01", "HH-02", "HH-03", "HH-04", "HH-06", "HH-09", "HH-10", "HH-11", "HH-12", "HH-13", "TL-01", "TL-03", "TL-08", "TL-09", "TL-10", "TL-11", "TL-13", "TL-14", "TL-15", "RP-01", "RP-02", "RP-03", "RP-04", "RP-05", "RP-06", "RP-07", "RP-08", "RP-09", "RP-10", "RP-11", "RP-12", "RP-13", "RP-14", "RP-15", "RP-16", "SH-01", "SH-02", "SH-03", "SH-04", "SH-05", "SH-07", "IR-01", "IR-02", "IR-03", "IR-04", "IR-05", "IR-06", "IR-07", "IR-08", "IR-09", "IR-10", "IR-11", "IR-12", "IR-13", "IR-14", "IR-16", "IR-17"] },
  { id = "A-RFC9110", name = "RFC 9110: HTTP Semantics", citation = "R. Fielding, M. Nottingham, J. Reschke (eds.), RFC 9110 (STD 97), June 2022, sections 5.1 (field names are case-insensitive), 5.3 (repeated fields), 5.5 (field values) 8.3.1 (media types are case-insensitive), 12.4.2 and 12.5.1 (quality values and the Accept field), 15.5.4 (403 Forbidden) and 15.5.6 (405 requires Allow), https://www.rfc-editor.org/rfc/rfc9110", checksum = "none", checksum_reason = "A published standard; no copy of it is committed here, so there is no artifact to checksum.", statement = "Field names are compared without regard to case; optional whitespace around a field value is not part of the value; a field value is visible ASCII, space and horizontal tab; a 405 response carries an Allow field; a media type is compared without regard to case, an Accept entry with a weight of zero is not acceptable, and 403 means the server understood the request and refuses it.", realized_by = ["LC-09", "HH-05", "HH-07", "SH-02", "SH-04"] },
  { id = "A-RFC4648", name = "RFC 4648: The Base16, Base32, and Base64 Data Encodings", citation = "S. Josefsson, RFC 4648, October 2006, section 4 (Base 64 Encoding) and section 3.5 (canonical encoding), https://www.rfc-editor.org/rfc/rfc4648", checksum = "none", checksum_reason = "A published standard; no copy of it is committed here, so there is no artifact to checksum.", statement = "The standard Base64 alphabet, padding to a multiple of four characters, and the canonical form in which the unused trailing bits are zero.", realized_by = ["HH-09", "HH-10"] },
  { id = "A-MCP-CONFORMANCE", name = "MCP conformance suite, scenarios and 2026-07-28 requirements", citation = "https://github.com/modelcontextprotocol/conformance at commit 232a9014457eaf4c59559916e3d616d2f7f28f05 (2026-08-07): src/scenarios/server/stateless.ts, src/scenarios/server/http-standard-headers.ts, src/connection/stateless.ts, src/scenarios/server/tools.ts, src/scenarios/server/json-schema-2020-12.ts, src/scenarios/server/resources.ts, src/scenarios/server/sse-multiple-streams.ts, src/scenarios/server/dns-rebinding.ts, src/scenarios/server/prompts.ts, src/scenarios/server/caching.ts, src/scenarios/server/utils.ts, src/scenarios/server/input-required-result.ts, src/scenarios/server/input-required-result-helpers.ts, src/scenarios/server/negative-mrtr.test.ts, examples/servers/typescript/everything-server.ts, the twelve files of src/scenarios/server/tasks (capability, composition, dispatch, headers, helpers, lifecycle, mrtr-helpers, mrtr-input, notifications, request-state, required-task-error and wire-fields), requirements/2026-07-28.yaml and LICENSE, vendored under crates/lifecycle-oracle/suite", checksum = "d4b7fd3939e7182488a3bd1bfc9d8cf1c50f0f0ed00cc71d9ee8c4460dd3602b", checksum_reason = "", statement = "Twenty-nine files. The checksum is SHA-256 over the manifest, one `<sha256 of file>  <path>` line per file in byte order of the paths. requirements/2026-07-28.yaml has SHA-256 ae2f4f6210fd729e2e318edd5bbfa31a43cee0bc608e48052fa26dbf1d939b57; the suite introduced it at this commit and has not changed it since, and it is the file the 0.2.0-alpha.10 anchor its own comment names. It lists server-stateless, tools-list, tools-call-simple-text, tools-call-image, tools-call-audio, tools-call-embedded-resource, tools-call-mixed-content, tools-call-error and tools-call-with-progress, completion-complete, resources-list, resources-read-text, resources-read-binary, resources-templates-read, sep-2164-resource-not-found, prompts-list, prompts-get-simple, prompts-get-with-args, prompts-get-embedded-resource, prompts-get-with-image, caching, server-sse-multiple-streams and dns-rebinding-protection as required, and marks http-header-validation, http-custom-header-server-validation and json-schema-2020-12 not scored, reason pending. tools.ts defines the tool scenarios, json-schema-2020-12.ts the focal inputSchema, resources.ts, prompts.ts, caching.ts and the completion scenario of utils.ts define the resource, prompt, completion and caching scenarios, sse-multiple-streams.ts sends three concurrent POSTs that each may be answered with JSON or an event stream, dns-rebinding-protection.ts sends a request whose Host and Origin name an attacker and one whose name the server's own address,, input-required-result.ts the fourteen input-required-result scenarios (SEP-2322) that the requirements list as required, with input-required-result-helpers.ts and the negative tests of negative-mrtr.test.ts, and everything-server.ts is the reference fixture whose tools, resources, templates, prompts, texts and test images the catalogs follow. The pinned requirements also run the ten tasks scenarios (tasks-lifecycle, tasks-capability-negotiation, tasks-wire-fields, tasks-request-state-removal, tasks-mrtr-input, tasks-request-headers, tasks-dispatch-and-envelope, tasks-status-notifications, tasks-required-task-error and tasks-mrtr-composition) as not scored, reason extension. At this commit tasks-status-notifications returns one skipped check and sends no request. The fixture tools of the tasks scenarios (greet, slow_compute, failing_job, protocol_error_job, confirm_delete, multi_input and test_tool_with_task) are named only by the scenarios' descriptions, not by the reference fixture. The vectors taken from these scenarios are falsifying evidence, not the verdict of a suite run.", realized_by = ["LC-12", "LC-14", "TL-01", "TL-02", "TL-03", "TL-04", "TL-05", "TL-06", "TL-07", "TL-08", "TL-13", "RP-01", "RP-02", "RP-03", "RP-04", "RP-05", "RP-06", "RP-07", "RP-08", "RP-09", "RP-10", "RP-11", "RP-13", "RP-15", "SH-03", "SH-04", "SH-05", "SH-06", "SH-10", "TL-19", "CF-03", "CF-04", "CF-05", "CF-07", "IR-01", "IR-02", "IR-03", "IR-04", "IR-05", "IR-06", "IR-07", "IR-08", "IR-09", "IR-10", "IR-11", "IR-12", "IR-13", "IR-14", "TK-16"] },
  { id = "A-MCP-SCHEMA-2026-07-28", name = "MCP specification schema, revision 2026-07-28", citation = "https://github.com/modelcontextprotocol/modelcontextprotocol at commit 80041ab0a139a8f4fb3adbc99f7ae9113ea59671: schema/2026-07-28/schema.json (git blob 213c58f6d9a1c2ce6ad055afe90bbdb095a29ee8, JSON Schema 2020-12) and LICENSE, vendored under crates/lifecycle-oracle/suite", checksum = "f2fcb135fa616971333db0c513a35e43b63cb5c2a9b96aff9fa5fdc03fe6c4e2", checksum_reason = "", statement = "Two files. The checksum is SHA-256 over the manifest, one `<sha256 of file>  <path>` line per file in byte order of the paths; schema/2026-07-28/schema.json has SHA-256 ef70b61f99b6d2e5e3b46863822eab08dff6a45bedc7a08914e0e5b133f40203. It defines JSONRPCResponse, whose error response has an optional id of type string or number and never null, and the typed result and error responses the tests check. A JSON Schema validator run against it is falsifying evidence, not the oracle for the protocol, which MCP#6 binds.", realized_by = ["LC-08", "LC-15", "CF-04", "CF-07"] },
  { id = "A-RFC6585", name = "RFC 6585: Additional HTTP Status Codes", citation = "M. Nottingham, R. Fielding, RFC 6585, April 2012, section 4 (429 Too Many Requests), https://www.rfc-editor.org/rfc/rfc6585", checksum = "none", checksum_reason = "A published standard; no copy of it is committed here, so there is no artifact to checksum.", statement = "The status code 429 indicates that the user has sent too many requests in a given amount of time (rate limiting); the response may include a Retry-After header.", realized_by = ["TL-14"] },
  { id = "A-JSON-SCHEMA-2020-12", name = "JSON Schema: A Media Type for Describing JSON Documents, and JSON Schema Validation, draft 2020-12", citation = "https://json-schema.org/draft/2020-12/json-schema-core and https://json-schema.org/draft/2020-12/json-schema-validation, sections 8 (the schema, $ref, $anchor, $defs), 10 (applicators), and 6 (validation keywords)", checksum = "none", checksum_reason = "A published specification; no copy of it is committed here, so there is no artifact to checksum.", statement = "The keywords type, enum, const, minimum, maximum, exclusiveMinimum, exclusiveMaximum, minLength, maxLength, minItems, maxItems, minProperties, maxProperties, required, properties, additionalProperties, items, allOf, anyOf, oneOf, not, if, then, else, $ref, $defs and $anchor, with the semantics the validator in Schema implements; a keyword outside that set is refused when a catalog is admitted rather than ignored.", realized_by = ["TL-02", "TL-10", "TL-11", "TL-16"] },
  { id = "A-RFC6901", name = "RFC 6901: JavaScript Object Notation (JSON) Pointer", citation = "P. Bryan, K. Zyp, M. Nottingham (eds.), RFC 6901, April 2013, section 3 (syntax) and section 5 (the escapes ~0 and ~1), https://www.rfc-editor.org/rfc/rfc6901", checksum = "none", checksum_reason = "A published standard; no copy of it is committed here, so there is no artifact to checksum.", statement = "A JSON Pointer is a sequence of reference tokens, each prefixed by a solidus, with tilde written ~0 and solidus written ~1; the empty pointer names the whole document.", realized_by = ["TL-10"] },
  { id = "A-WHATWG-SSE", name = "HTML Standard, Server-sent events", citation = "WHATWG, HTML Living Standard, section 9.2 (Server-sent events), 9.2.5 (the text/event-stream MIME type and its authoring notes) and 9.2.6 (interpreting an event stream), https://html.spec.whatwg.org/multipage/server-sent-events.html", checksum = "none", checksum_reason = "A published standard; no copy of it is committed here, so there is no artifact to checksum.", statement = "An event stream is UTF-8 text in lines ended by LF, CR or CRLF; a line holding a field name, a colon, an optional space and a value sets that field (data, event, id, retry); a blank line dispatches the event with its data lines joined by LF; a line that starts with a colon is a comment; an event with no data is not dispatched; the media type is text/event-stream.", realized_by = ["SH-01"] },
  { id = "A-PRISMPM-SERVER-APPLICATION", name = "PrismPM ServerApplication model and server build", citation = "https://github.com/UOR-Foundation/PrismPM at commit f5927bf46b92179d807ee6bf987f024b2f5a4e7e (pull request 339): stdlib/src/Foundation/Bytes.lex.tex, stdlib/src/Foundation/Server/V1/Model.lex.tex and the lexicon package language/prism.arch, copied under conformance/src/Foundation and language/prism.arch; .github/prismpm.rev pins this commit", checksum = "608f7640012d85fd604192c9c086b8f0d0321741ca918f604fc3605081c19504", checksum_reason = "", statement = "Thirty-seven files. The checksum is SHA-256 over the manifest, one `<sha256 of file>  <path>` line per file in byte order of the paths from the repository root; the files are byte for byte the PrismPM files, which CI compares at the revision .github/prismpm.rev names. The model declares a server application of profile prismpm/server-application/1: a core root, the loopback serving bounds and the request and response frame the adapter writes, and the vectors the build accepts the core by. The build generates the core package and two host packages, and a consumer workspace supplies the binding crate that implements the host trait. The build is evidence of what PrismPM generates, not a proof about the generated program.", realized_by = ["CF-01", "CF-02", "CF-06", "CF-07"] },
  { id = "A-RFC2104", name = "RFC 2104: HMAC: Keyed-Hashing for Message Authentication", citation = "H. Krawczyk, M. Bellare, R. Canetti, RFC 2104, February 1997, section 2 (definition of HMAC), https://www.rfc-editor.org/rfc/rfc2104", checksum = "none", checksum_reason = "A published standard; no copy of it is committed here, so there is no artifact to checksum.", statement = "HMAC(K, text) = H((K0 xor opad) || H((K0 xor ipad) || text)), where K0 is the key padded with zero bytes to the block size, or the hash of the key padded so when the key is longer than the block, ipad is the byte 0x36 repeated and opad the byte 0x5c repeated.", realized_by = ["IR-11", "IR-15"] },
  { id = "A-RFC4231", name = "RFC 4231: Identifiers and Test Vectors for HMAC-SHA-224, HMAC-SHA-256, HMAC-SHA-384, and HMAC-SHA-512", citation = "M. Nystrom, RFC 4231, December 2005, section 4 (test vectors), test cases 1, 2, 3, 4, 6 and 7, https://www.rfc-editor.org/rfc/rfc4231", checksum = "none", checksum_reason = "A published standard; no copy of it is committed here, so there is no artifact to checksum.", statement = "The HMAC-SHA-256 digest of each test case: case 1 b0344c61d8db38535ca8afceaf0bf12b881dc200c9833da726e9376c2e32cff7, case 2 5bdcc146bf60754e6a042426089575c75a003f089d2739839dec58b964ec3843, case 3 773ea91e36800e46854db8ebd09181a72959098b3ef8c122d9635514ced565fe, case 4 82558a389a443c0ea4cc819899f2083a85f0faa3e578f8077a2e3ff46729665b, case 6 60e431591ee0b67f0d8a26aacbf5b77f8e0bc6213728c5140546040f0ee37f54 (a 131-byte key) and case 7 9b09ffa71b942fcb27635fbcd5b0e944bfdc63644f0713938a7f51535c3a35e2 (the same key and a longer text).", realized_by = ["IR-15"] },
  { id = "A-FIPS-180-4", name = "FIPS 180-4: Secure Hash Standard", citation = "NIST, FIPS PUB 180-4, August 2015, section 6.2 (SHA-256), https://csrc.nist.gov/pubs/fips/180-4/upd1/final", checksum = "none", checksum_reason = "A published standard; no copy of it is committed here, so there is no artifact to checksum.", statement = "SHA-256 of the message abc is ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad, of the empty message e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855, and of the 56-byte message abcdbcdecdefdefgefghfghighijhijkijkljklmklmnlmnomnopnopq 248d6a61d20638b8e5c026930c3e6039a33ce45964ff2167f6ecedd419db06c1; the module Sha256 states the three as theorems.", realized_by = ["IR-15"] },
  { id = "A-MCP-EXT-TASKS", name = "MCP tasks extension, io.modelcontextprotocol/tasks (SEP-2663)", citation = "https://github.com/modelcontextprotocol/ext-tasks at commit 899c1bbc869567670093face3591b39c28ce3219 (2026-10-09): specification/2026-07-28/tasks.md, schema/2026-07-28/schema.json and LICENSE, vendored under crates/lifecycle-oracle/suite; the proposal is docs/seps/2663-tasks-extension.mdx of https://github.com/modelcontextprotocol/modelcontextprotocol at commit 80041ab0a139a8f4fb3adbc99f7ae9113ea59671, which is not vendored", checksum = "233cf0e2569801fd4ad973a9bc6c2d2ba98a9f4130eefe723ed008c0b9e87558", checksum_reason = "", statement = "Three files. The checksum is SHA-256 over the manifest, one `<sha256 of file>  <path>` line per file in byte order of the paths. The extension is identified as io.modelcontextprotocol/tasks and declared as an empty object in the client's per-request capabilities and in the server's server/discover capabilities. The server decides per request whether tools/call answers a CreateTaskResult (resultType task, a flat Result and Task), never to a client that did not declare the extension; a request the server can only service as a task from a client without the extension is refused with -32021 and data.requiredCapabilities. A task has taskId, status (working, input_required, completed, failed, cancelled), optional statusMessage, createdAt, lastUpdatedAt, ttlMs (an integer, or null for unlimited) and optional pollIntervalMs; completed, failed and cancelled are terminal. tasks/get answers the DetailedTask with resultType complete: inputRequests for input_required, result for completed, the JSON-RPC error for failed. tasks/update acknowledges with an empty result and ignores keys that are not outstanding. tasks/cancel acknowledges with an empty result and is cooperative. notifications/tasks carries a complete DetailedTask and travels on subscriptions/listen. tasks/get, tasks/update and tasks/cancel carry Mcp-Name equal to params.taskId. The specification schema of 80041ab has no task type; this schema types the results and the notification.", realized_by = ["TK-01", "TK-02", "TK-03", "TK-04", "TK-05", "TK-06", "TK-07", "TK-08", "TK-09", "TK-10", "TK-11", "TK-12", "TK-13", "TK-16"] },
