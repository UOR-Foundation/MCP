# model/ledger.toml --- the honesty ledger for claims that are not conformance
# IDs (R2).
#
# The conformance IDs and their levels live in `model/ids.toml`, which is the
# register; duplicating them here would give a claim two sources, which is
# exactly what R1 forbids. What remains is the two kinds of claim that have no
# ID: the facts this repository *reproduces* from an authority, and the
# quantities it *measures* and never asserts.
#
# The meta-gate proves the suite never asserts an `open` claim as established,
# and `CM-03` proves every `some-true` row cites an authority that exists.
#
# The claims below are facts the codec and the stateless lifecycle reproduce from the
# standards, the specification and the corpus they cite; the level of each is some-true.

spec = "template/1"

claim = [
  { id = "AUTH-01", level = "some-true", statement = "RFC 8259 defines the JSON text grammar the parser implements.", authority = "A-RFC8259" },
  { id = "AUTH-02", level = "some-true", statement = "RFC 3629 defines the well-formed UTF-8 byte sequences the validator implements.", authority = "A-RFC3629" },
  { id = "AUTH-03", level = "some-true", statement = "The pinned JSONTestSuite classifies each of its 318 files as must-accept, must-reject or implementation-defined.", authority = "A-JSONTESTSUITE" },
  { id = "AUTH-04", level = "some-true", statement = "The MCP specification revision 2026-07-28 defines the per-request _meta, the discovery result, the header checks and the HTTP statuses the lifecycle implements.", authority = "A-MCP-SPEC-2026-07-28" },
  { id = "AUTH-05", level = "some-true", statement = "RFC 9110 defines the case-insensitive field names, the optional whitespace and the 405 Allow requirement the header handling implements.", authority = "A-RFC9110" },
  { id = "AUTH-06", level = "some-true", statement = "RFC 4648 defines the Base64 alphabet, padding and canonical form the parameter header decoder implements.", authority = "A-RFC4648" },
  { id = "AUTH-07", level = "some-true", statement = "The pinned conformance suite lists server-stateless as required for 2026-07-28 and the two HTTP header scenarios as pending and not scored.", authority = "A-MCP-CONFORMANCE" },
  { id = "AUTH-08", level = "some-true", statement = "The MCP schema for 2026-07-28 defines the JSON-RPC error response with an optional id of type string or number, and the typed results and errors of server/discover, tools/list, tools/call and the codes the lifecycle uses.", authority = "A-MCP-SCHEMA-2026-07-28" },
  { id = "AUTH-09", level = "some-true", statement = "RFC 6585 section 4 defines the status 429 for a client that has sent too many requests in a given time.", authority = "A-RFC6585" },
  { id = "AUTH-10", level = "some-true", statement = "JSON Schema draft 2020-12 defines the validation keywords, the applicators and the reference keywords the tool schema validator implements.", authority = "A-JSON-SCHEMA-2020-12" },
  { id = "AUTH-11", level = "some-true", statement = "RFC 6901 defines the JSON Pointer syntax and escapes the argument error text uses to name the failing instance.", authority = "A-RFC6901" },
  { id = "AUTH-12", level = "some-true", statement = "The pinned conformance suite lists tools-list, tools-call-simple-text, tools-call-image, tools-call-audio, tools-call-embedded-resource, tools-call-mixed-content, tools-call-error and tools-call-with-progress as required for 2026-07-28 and json-schema-2020-12 as pending and not scored.", authority = "A-MCP-CONFORMANCE" },
]
