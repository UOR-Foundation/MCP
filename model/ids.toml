# model/ids.toml --- the conformance ID register.
#
# Every ID this repository claims, in one place, so that nothing is referenced
# without being defined. `CONFORMANCE.md` is generated from this file. A test
# whose name ends in an ID not listed here fails `check-model`, and an ID listed
# here with no scenario and no test fails it too (CM-02).
#
# `level` is the honesty level (R2):
#   some-true  a fact reproduced from an authority; not established here
#   build      constructed here and validated against its oracle
#   open       measured and reported, never asserted
#
# Every row here has a scenario in `features/suites/` and a test whose name ends
# in the ID, lowercased with underscores (R3, CM-02). There is no "pending"
# state: a capability that is not built does not get a row, and every row in this
# file is built.
#
# The JSON text codec (issue #18) is the first capability registered: JC-01..JC-12, extended by JC-13 to JC-16.
# Resources, templates, prompts, completion and caching (issue #9) are RP-01..RP-19.

spec = "template/1"

[[id]]
id = "JC-01"
level = "build"
suite = "json-codec"
statement = "Unicode byte validation admits exactly the byte strings RFC 3629 Table 3-7 admits, and refuses an overlong form, a surrogate code point, a value above the last code point and a truncated sequence, naming the offset of the first byte the table does not admit, or the end of the input when a sequence is cut short."

[[id]]
id = "JC-02"
level = "build"
suite = "json-codec"
statement = "The parser refuses every byte string that is not well-formed UTF-8, with the typed refusals invalidUtf8 or truncatedUtf8 and an offset, before it reads any JSON structure."

[[id]]
id = "JC-03"
level = "build"
suite = "json-codec"
statement = "The parser accepts every text of the RFC 8259 grammar that the pinned JSONTestSuite lists as must-accept (the y_ cases)."

[[id]]
id = "JC-04"
level = "build"
suite = "json-codec"
statement = "The parser refuses every text that the pinned JSONTestSuite lists as must-reject (the n_ cases) with a typed refusal, and each case's refusal kind equals the recorded table."

[[id]]
id = "JC-05"
level = "build"
suite = "json-codec"
statement = "The parser's outcome on every implementation-defined case of the pinned JSONTestSuite (the i_ cases) equals the recorded table."

[[id]]
id = "JC-06"
level = "build"
suite = "json-codec"
statement = "String escapes decode as RFC 8259 section 7 states, an escaped surrogate pair is one code point, a lone surrogate escape is refused as loneSurrogate, and an unescaped control character is refused."

[[id]]
