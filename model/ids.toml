# Streamable HTTP transport (issue 11): SH-01..SH-10.

[[id]]
id = "SH-01"
level = "build"
suite = "transport"
statement = "A request that accepts text/event-stream and is answered with HTTP status 200 and progress notifications is answered as an event stream with Content-Type text/event-stream, Cache-Control no-cache and X-Accel-Buffering no; the body is the notifications in the order the tool produced them and then the result, each message one event of a single data line holding the compact JSON-RPC message and ending in a blank line, with no id, event or retry field because resumption is not supported, so that a client following the WHATWG event stream format reads the messages in order with the result last; a kernel-checked theorem states the framing."

[[id]]
id = "SH-02"
level = "build"
suite = "transport"
statement = "An answer that is not an event stream is the single JSON object with Content-Type application/json: when the request does not accept text/event-stream (no Accept field, a media range other than the event stream itself, or a weight of zero), when the answer carries no notification, and for every status other than 200; a client that does not accept the stream receives the result alone, without the progress notifications; kernel-checked theorems state the cases of the Accept field."

[[id]]
id = "SH-03"
level = "build"
suite = "transport"
statement = "Every POST is its own exchange and its own response stream: the answer to a request is a function of its frame alone, so the concurrent POSTs of server-sse-multiple-streams are independent, each stream carries only its own request id and progress token, and the core keeps nothing between them; one stream per connection and the closing of a stream as cancellation belong to the host adapter (PrismPM#216)."

[[id]]
id = "SH-04"
level = "build"
suite = "transport"
statement = "A request whose Origin is present and names a host outside the allow-list (the loopback names localhost, 127.0.0.1 and [::1] with any port, and the names the host adds to the frame) is refused as forbiddenOrigin with HTTP status 403 and a JSON-RPC error with code -32000 and no id member, before the method, the body or the provider is read; a request whose Origin and Host both name an allowed host is served as before; a kernel-checked theorem states that a refused request is answered by the refusal alone."

[[id]]
id = "SH-05"
level = "build"
suite = "transport"
statement = "A request whose Host is present and names a host outside the allow-list is refused as forbiddenHost with HTTP status 403 and the same body shape; the Origin is judged before the Host; a request with no Origin, or with no Host, is not refused for its absence, because a browser sends both on a rebinding request and a client that is not a browser sends neither."

[[id]]
id = "SH-06"
level = "build"
suite = "transport"
statement = "The streaming probes of server-stateless that issue 7 left to this issue: server/discover advertises no listChanged and no subscribe capability and subscriptions/listen is answered as methodNotFound (-32601, HTTP status 404), which the scenario reads as a feature that is absent, so the probes at lines 1037 and 1144 are vectors and those at 1209 and 1279 are not reached; the probes at lines 887 and 947 need diagnostic tools the fixture does not list and are listed as not run."

[[id]]
id = "SH-07"
level = "build"
suite = "transport"
statement = "An Origin or Host the core cannot judge is refused like a foreign one: the opaque origin null, a value with a path or user information, a port that is not digits or is empty, an Origin without a scheme, an unclosed bracket, an empty value, a repeated field and a value with a control byte; a name that only starts like an allowed one (localhost.evil.example) is refused; names compare without regard to case and optional whitespace is not part of a value."

[[id]]
id = "SH-08"
level = "build"
suite = "transport"
statement = "The host's allow-list rides in the request frame after the tool-call count as a count and length-prefixed names: a frame that ends after the count carries none, a name in the list is allowed, a name not in it is refused, and a frame cut inside the list or followed by bytes after it is a frame the core cannot read (HTTP status 500)."

[[id]]
id = "SH-09"
level = "build"
suite = "transport"
statement = "No function of the transport recurses except as a loop: an Accept field of two hundred thousand media ranges and an allow-list of one hundred thousand names are judged on the default 2 MiB stack."

[[id]]
id = "SH-10"
level = "build"
suite = "transport"
statement = "The transport scenarios and the streaming probes are accounted for: every request the vendored sse-multiple-streams.ts and dns-rebinding.ts send is a vector, every check id they emit is a vector's or is listed, and each probe of server-stateless that issue 7 left to this issue is a vector or is listed with a reason and an owner."

[[id]]
id = "IR-01"
level = "build"
suite = "input-required"
statement = "A tools/call of test_input_required_result_elicitation without inputResponses is answered with HTTP status 200 and an InputRequiredResult whose resultType is input_required and whose inputRequests holds one request, user_name, of method elicitation/create with a message and a requestedSchema; the retry with an accepted ElicitResult for user_name is answered with a complete result whose content is a text block."

[[id]]
id = "IR-02"
level = "build"
suite = "input-required"
statement = "A tools/call of test_input_required_result_sampling without inputResponses is answered with an InputRequiredResult whose one inputRequest is of method sampling/createMessage with a user message and maxTokens; the retry carrying the sampling result for that key is answered with a complete result that quotes the sampled text."

[[id]]
id = "IR-03"
level = "build"
suite = "input-required"
statement = "A tools/call of test_input_required_result_list_roots without inputResponses is answered with an InputRequiredResult whose one inputRequest is of method roots/list with empty params; the retry carrying a ListRootsResult for that key is answered with a complete result that counts the roots."

[[id]]
id = "IR-04"
level = "build"
suite = "input-required"
statement = "A tools/call of test_input_required_result_request_state is answered with an InputRequiredResult that carries inputRequests and a requestState text; the retry that echoes the requestState exactly and answers the request is answered with a complete result whose text contains state-ok, and a retry without the requestState is asked again rather than completed."

[[id]]
id = "IR-05"
level = "build"
suite = "input-required"
statement = "A tools/call of test_input_required_result_multiple_inputs is answered with one InputRequiredResult whose inputRequests hold an elicitation, a sampling and a roots/list request under three distinct keys, with a requestState; the retry that answers all three and echoes the requestState is answered with a complete result."

[[id]]
id = "IR-06"
level = "build"
suite = "input-required"
statement = "A tools/call of test_input_required_result_multi_round is answered over three rounds: the first and the second are InputRequiredResults, each with inputRequests and a requestState, the requestState of the second differs from the first, and the third, retried with the answer to the second round and its requestState, is a complete result."

[[id]]
id = "IR-07"
level = "build"
suite = "input-required"
statement = "A retry whose inputResponses lack a key the server needs, or carry only keys it did not ask for, is answered with HTTP status 200 and a new InputRequiredResult asking again, and only for the missing keys, never with a JSON-RPC error."

[[id]]
id = "IR-08"
level = "build"
suite = "input-required"
statement = "A prompts/get of test_input_required_result_prompt without inputResponses is answered with an InputRequiredResult asking user_context by elicitation/create, and the retry carrying the answer is answered with a complete GetPromptResult that has messages, because InputRequiredResult is not specific to tools/call."

[[id]]
id = "IR-09"
level = "build"
suite = "input-required"
statement = "Every InputRequiredResult carries the member resultType with the value input_required, the serverInfo of the serving provider under _meta as every result does, and conforms to the specification schema; a result that is complete carries the resultType complete."

[[id]]
id = "IR-10"
level = "build"
suite = "input-required"
statement = "InputRequiredResult is sent on tools/call, resources/read and prompts/get only: tools/list and prompts/list are never answered with resultType input_required, and a provider result of that type on any other method is refused as misplacedInputRequired, JSON-RPC code -32603, HTTP status 500, message Internal error and no data; kernel-checked theorems state both."

[[id]]
id = "IR-11"
level = "build"
suite = "input-required"
statement = "A requestState that fails verification, whether it was altered, truncated, extended, malformed, sealed for another method or tool, or sealed under another key, is refused as invalidRequestState with JSON-RPC code -32602, HTTP status 400, message Invalid params: requestState failed verification and no data, before the tool runs; a kernel-checked theorem states that a refused request never reaches the answer function."

[[id]]
id = "IR-12"
level = "build"
suite = "input-required"
statement = "A tool that answers with inputRequests for a capability the client did not declare in _meta is refused as missingCapability, JSON-RPC code -32021, HTTP status 400, with the undeclared capabilities in data.requiredCapabilities, and a tool that reads the client capabilities asks only for the declared ones: a client that declares only sampling is asked to sample and not to elicit."

[[id]]
id = "IR-13"
level = "build"
suite = "input-required"
statement = "Keys of inputResponses that the server did not ask for are ignored when they are objects: a retry that answers user_name and adds unknown keys is answered with the complete result."

[[id]]
id = "IR-14"
level = "build"
suite = "input-required"
statement = "inputResponses that are not a JSON object, an entry that is not an object, and an entry for an expected key that does not fit its result type (an ElicitResult without a valid action, a CreateMessageResult without a model, a ListRootsResult whose roots are not an array) are refused as invalidInputResponses or as invalid params, JSON-RPC code -32602, HTTP status 400, and never completed."

[[id]]
id = "IR-15"
level = "build"
suite = "input-required"
statement = "HMAC-SHA-256 (RFC 2104 over SHA-256 of FIPS 180-4) is computed in the model: the digests of the RFC 4231 test cases 1, 2, 3, 4, 6 and 7, including the two with a key longer than the 64-byte block, are kernel-checked theorems, and the tag in a requestState equals the HMAC-SHA-256 that an independent implementation computes over the length-prefixed method and name and the payload."

[[id]]
id = "IR-16"
level = "build"
suite = "input-required"
statement = "The requestState key arrives in the request frame and a key of fewer than 32 bytes is no key: a result that needs a requestState is refused as requestStateKeyMissing, JSON-RPC code -32603, HTTP status 500 and no data, instead of being sent unprotected, a state presented without a key is refused as invalid, and a request that needs no state is served without a key."

[[id]]
id = "IR-17"
level = "build"
suite = "input-required"
statement = "An InputRequiredResult with neither inputRequests nor requestState is refused as emptyInputRequired, JSON-RPC code -32603, HTTP status 500 and no data, because the specification requires at least one; a kernel-checked theorem states it."

[[id]]
id = "IR-18"
level = "build"
suite = "input-required"
statement = "The request frame carries the requestState key after the count of tool calls as a length-prefixed byte string, and a frame that ends inside it or has bytes after it is a frame the core cannot read: HTTP status 500 and the fixed internal-error body."

[[id]]
id = "IR-19"
level = "build"
suite = "input-required"
statement = "The result bodies of elicitation (form and URL), sampling (messages with text, image, audio, tool_use and tool_result content, model preferences, system prompt, include context, temperature, stop sequences, metadata, tools and tool choice) and roots requests are written as the JSON that the specification schema names, and every string of them is sanitized as a tool result is."
