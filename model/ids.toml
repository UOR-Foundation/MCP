# Streamable HTTP transport (issue 11): SH-01..SH-10.

[[id]]
id = "SH-01"
level = "build"
suite = "transport"
statement = "A request that accepts text/event-stream and is answered with HTTP status 200 and progress notifications is answered as an event stream with Content-Type text/event-stream, Cache-Control no-cache and X-Accel-Buffering no; the body is the notifications in the order the tool produced them and then the result, each message one event of a single data line holding the compact JSON-RPC message and ending in a blank line, with no id, event or retry field because resumption is not supported, so that a client following the WHATWG event stream format reads the messages in order with the result last; a kernel-checked theorem states the framing."

[[id]]
id = "SH-02"
level = "build"
suite = "transport"
statement = "An answer that is not an event stream is the single JSON object with Content-Type application/json: when the request does not accept text/event-stream (no Accept field, a media range other than the event stream itself, or a weight of zero), when the answer carries no notification, and for every status other than 200; a client that does not accept the stream receives the result alone, without the progress notifications; kernel-checked theorems state the cases of the Accept field."

[[id]]
id = "SH-03"
level = "build"
suite = "transport"
statement = "Every POST is its own exchange and its own response stream: the answer to a request is a function of its frame alone, so the concurrent POSTs of server-sse-multiple-streams are independent, each stream carries only its own request id and progress token, and the core keeps nothing between them; one stream per connection and the closing of a stream as cancellation belong to the host adapter (PrismPM#216)."

[[id]]
id = "SH-04"
level = "build"
suite = "transport"
statement = "A request whose Origin is present and names a host outside the allow-list (the loopback names localhost, 127.0.0.1 and [::1] with any port, and the names the host adds to the frame) is refused as forbiddenOrigin with HTTP status 403 and a JSON-RPC error with code -32000 and no id member, before the method, the body or the provider is read; a request whose Origin and Host both name an allowed host is served as before; a kernel-checked theorem states that a refused request is answered by the refusal alone."

[[id]]
id = "SH-05"
level = "build"
suite = "transport"
statement = "A request whose Host is present and names a host outside the allow-list is refused as forbiddenHost with HTTP status 403 and the same body shape; the Origin is judged before the Host; a request with no Origin, or with no Host, is not refused for its absence, because a browser sends both on a rebinding request and a client that is not a browser sends neither."

[[id]]
id = "SH-06"
level = "build"
suite = "transport"
statement = "The streaming probes of server-stateless that issue 7 left to this issue: server/discover advertises no listChanged and no subscribe capability and subscriptions/listen is answered as methodNotFound (-32601, HTTP status 404), which the scenario reads as a feature that is absent, so the probes at lines 1037 and 1144 are vectors and those at 1209 and 1279 are not reached; the probes at lines 887 and 947 need diagnostic tools the fixture does not list and are listed as not run."

[[id]]
id = "SH-07"
level = "build"
suite = "transport"
statement = "An Origin or Host the core cannot judge is refused like a foreign one: the opaque origin null, a value with a path or user information, a port that is not digits or is empty, an Origin without a scheme, an unclosed bracket, an empty value, a repeated field and a value with a control byte; a name that only starts like an allowed one (localhost.evil.example) is refused; names compare without regard to case and optional whitespace is not part of a value."

[[id]]
id = "SH-08"
level = "build"
suite = "transport"
statement = "The host's allow-list rides in the request frame after the tool-call count as a count and length-prefixed names: a frame that ends after the count carries none, a name in the list is allowed, a name not in it is refused, and a frame cut inside the list or followed by bytes after it is a frame the core cannot read (HTTP status 500)."

[[id]]
id = "SH-09"
level = "build"
suite = "transport"
statement = "No function of the transport recurses except as a loop: an Accept field of two hundred thousand media ranges and an allow-list of one hundred thousand names are judged on the default 2 MiB stack."

[[id]]
id = "SH-10"
level = "build"
suite = "transport"
statement = "The transport scenarios and the streaming probes are accounted for: every request the vendored sse-multiple-streams.ts and dns-rebinding.ts send is a vector, every check id they emit is a vector's or is listed, and each probe of server-stateless that issue 7 left to this issue is a vector or is listed with a reason and an owner."

[[id]]
id = "TK-01"
level = "build"
suite = "tasks"
statement = "The server declares the extension io.modelcontextprotocol/tasks under capabilities.extensions of its server/discover result, with the empty object that means support without settings, and declares no capabilities.tasks member; the declaration is the server's and does not depend on what the client declared."

[[id]]
id = "TK-02"
level = "build"
suite = "tasks"
statement = "tasks/get, tasks/update and tasks/cancel from a client whose request does not declare the extension, in the session capabilities or in the request's own _meta, are refused as missingRequiredClientCapability (-32021, HTTP 400) with data.requiredCapabilities.extensions naming the extension, before the task is looked up and without changing the task table."

[[id]]
id = "TK-03"
level = "build"
suite = "tasks"
statement = "Whether a tools/call becomes a task is the server's decision and no request member asks for it: a tool that supports tasks answers a client that declared the extension with a CreateTaskResult and any other client with the result it would have returned at once; a tool that does not support tasks never answers a task, whatever a legacy task member of the request says; the arguments are validated and the rate limit applies before a task is created."

[[id]]
id = "TK-04"
level = "build"
suite = "tasks"
statement = "A tools/call of a tool that can only be a task, from a client that did not declare the extension, is refused as missingRequiredClientCapability (-32021, HTTP 400) with data.requiredCapabilities.extensions naming the extension, and creates no task."

[[id]]
id = "TK-05"
level = "build"
suite = "tasks"
statement = "A created task is answered as a flat CreateTaskResult: resultType task and the task's taskId, status, createdAt, lastUpdatedAt and ttlMs at the top level, with no nested task member, no result, error, inputRequests or requestState, and no notification; the identifier and the instants are the host's, and a tasks/get for the identifier resolves as soon as the result is returned, because the task is in the table the response returns."

[[id]]
id = "TK-06"
level = "build"
suite = "tasks"
statement = "ttlMs and pollIntervalMs are integers in milliseconds (ttlMs null when unlimited) and the legacy ttl and pollInterval members are not written; a task is kept for its ttlMs and is dropped from the table, and so answered as unknown, only once that has elapsed; the inlined result carries no related-task _meta."

[[id]]
id = "TK-07"
level = "build"
suite = "tasks"
statement = "tasks/get answers the DetailedTask of the instant it is asked: working without a result, input_required with inputRequests, completed with the tool's result inlined (a tool error is completed with isError true), failed with the JSON-RPC error and no result, or cancelled; resultType is complete and no requestState is written; a working task whose work has finished by the host's clock is answered as finished."

[[id]]
id = "TK-08"
level = "build"
suite = "tasks"
statement = "tasks/get, tasks/update and tasks/cancel for a task the table does not hold are refused as invalidParams (-32602, HTTP 400), and tasks/result and tasks/list, which the extension removed, are not offered: methodNotFound (-32601, HTTP 404)."

[[id]]
id = "TK-09"
level = "build"
suite = "tasks"
statement = "tasks/cancel is acknowledged with an empty result whose resultType is complete; a working or waiting task becomes cancelled; a task that is already terminal, or that finished by the host's clock before the cancel arrived, is acknowledged and stays as it was."

[[id]]
id = "TK-10"
level = "build"
suite = "tasks"
statement = "A task that waits for input is answered input_required with inputRequests keyed by identifiers that are unique over the task; tasks/update with inputResponses is acknowledged with an empty result and removes the keys it answers; answers to keys that are not outstanding are ignored; the task stays input_required while any key remains and resumes when none does; a task that is not waiting for input is not changed by an update."

[[id]]
id = "TK-11"
level = "build"
suite = "tasks"
statement = "tasks/get, tasks/update and tasks/cancel need an Mcp-Name header equal to params.taskId, and every request an Mcp-Method equal to its method; a missing or different value is refused as headerMismatch (-32020, HTTP 400) without changing the table."

[[id]]
id = "TK-12"
level = "build"
suite = "tasks"
statement = "A change the core makes to a task while it answers a request (the task settles, parks for input, is answered or is cancelled) is written, beside the body, as a notifications/tasks notification that carries the complete task exactly as tasks/get would have answered it at that moment; creating a task and a request that changes nothing write none, and the encoding of the stream is #11's. The pinned scenario tasks-status-notifications sends no request, so no vector stands for this row."

[[id]]
id = "TK-13"
level = "build"
suite = "tasks"
statement = "A tool that asks for input before it becomes a task answers its first round with an input_required result that carries inputRequests and no taskId, and its last round with a CreateTaskResult that carries no requestState or inputRequests, whose task finishes with a result that reflects the answer given; the last round is refused to a client that did not declare the extension."

[[id]]
id = "TK-14"
level = "build"
suite = "tasks"
statement = "The task lifecycle is stated in kernel-checked theorems: a task in a terminal state is not changed by settling, answering or cancelling; an update changes a task only while it is input_required; cancelling a working or waiting task yields a cancelled task; only a completed task carries a result; every step keeps the task's identifier and creation instant; a task is expired only once its ttl has elapsed."

[[id]]
id = "TK-15"
level = "build"
suite = "tasks"
statement = "The core keeps no task state: the host supplies a clock, the identifier of a task the request may create and the task table with each request, and stores the table the response returns; a table that cannot be read, a host that supplies no identifier and a frame whose host section is cut or is not text are server errors (-32603 or the fixed internal body, HTTP 500) that leave the table as it was; the table is returned only when a task was created or touched."

[[id]]
id = "TK-16"
level = "build"
suite = "tasks"
statement = "The ten tasks scenarios at the pinned suite commit and the pinned ext-tasks commit are accounted for: every request they send is a step of vectors/tasks.json with its file and line, every check id they emit is covered or listed with its reason, the vendored files match the checksums the authorities record, and the requirements file runs the scenarios as extension scenarios that are not scored."
