# Streamable HTTP transport (issue 11): SH-01..SH-10.

[[id]]
id = "SH-01"
level = "build"
suite = "transport"
statement = "A request that accepts text/event-stream and is answered with HTTP status 200 and progress notifications is answered as an event stream with Content-Type text/event-stream, Cache-Control no-cache and X-Accel-Buffering no; the body is the notifications in the order the tool produced them and then the result, each message one event of a single data line holding the compact JSON-RPC message and ending in a blank line, with no id, event or retry field because resumption is not supported, so that a client following the WHATWG event stream format reads the messages in order with the result last; a kernel-checked theorem states the framing."

[[id]]
id = "SH-02"
level = "build"
suite = "transport"
statement = "An answer that is not an event stream is the single JSON object with Content-Type application/json: when the request does not accept text/event-stream (no Accept field, a media range other than the event stream itself, or a weight of zero), when the answer carries no notification, and for every status other than 200; a client that does not accept the stream receives the result alone, without the progress notifications; kernel-checked theorems state the cases of the Accept field."

[[id]]
id = "SH-03"
level = "build"
suite = "transport"
statement = "Every POST is its own exchange and its own response stream: the answer to a request is a function of its frame alone, so the concurrent POSTs of server-sse-multiple-streams are independent, each stream carries only its own request id and progress token, and the core keeps nothing between them; one stream per connection and the closing of a stream as cancellation belong to the host adapter (PrismPM#216)."

[[id]]
id = "SH-04"
level = "build"
suite = "transport"
statement = "A request whose Origin is present and names a host outside the allow-list (the loopback names localhost, 127.0.0.1 and [::1] with any port, and the names the host adds to the frame) is refused as forbiddenOrigin with HTTP status 403 and a JSON-RPC error with code -32000 and no id member, before the method, the body or the provider is read; a request whose Origin and Host both name an allowed host is served as before; a kernel-checked theorem states that a refused request is answered by the refusal alone."

[[id]]
id = "SH-05"
level = "build"
suite = "transport"
statement = "A request whose Host is present and names a host outside the allow-list is refused as forbiddenHost with HTTP status 403 and the same body shape; the Origin is judged before the Host; a request with no Origin, or with no Host, is not refused for its absence, because a browser sends both on a rebinding request and a client that is not a browser sends neither."

[[id]]
id = "SH-06"
level = "build"
suite = "transport"
statement = "The streaming probes of server-stateless that issue 7 left to this issue: server/discover advertises no listChanged and no subscribe capability and subscriptions/listen is answered as methodNotFound (-32601, HTTP status 404), which the scenario reads as a feature that is absent, so the probes at lines 1037 and 1144 are vectors and those at 1209 and 1279 are not reached; the probes at lines 887 and 947 call the diagnostic tools that TL-19 lists and are the vectors TS-10 and TS-11."

[[id]]
id = "SH-07"
level = "build"
suite = "transport"
statement = "An Origin or Host the core cannot judge is refused like a foreign one: the opaque origin null, a value with a path or user information, a port that is not digits or is empty, an Origin without a scheme, an unclosed bracket, an empty value, a repeated field and a value with a control byte; a name that only starts like an allowed one (localhost.evil.example) is refused; names compare without regard to case and optional whitespace is not part of a value."

[[id]]
id = "SH-08"
level = "build"
suite = "transport"
statement = "The host's allow-list rides in the request frame after the tool-call count as a count and length-prefixed names: a frame that ends after the count carries none, a name in the list is allowed, a name not in it is refused, and a frame cut inside the list or followed by bytes after it is a frame the core cannot read (HTTP status 500)."

[[id]]
id = "SH-09"
level = "build"
suite = "transport"
statement = "No function of the transport recurses except as a loop: an Accept field of two hundred thousand media ranges and an allow-list of one hundred thousand names are judged on the default 2 MiB stack."

[[id]]
id = "SH-10"
level = "build"
suite = "transport"
statement = "The transport scenarios and the streaming probes are accounted for: every request the vendored sse-multiple-streams.ts and dns-rebinding.ts send is a vector, every check id they emit is a vector's or is listed, and each probe of server-stateless that issue 7 left to this issue is a vector or is listed with a reason and an owner."

# The conformance build and the oracle run (issue #13): CF-01..CF-08.

[[id]]
id = "CF-01"
level = "build"
suite = "conformance"
statement = "The conformance build is a PrismPM server application declared in this repository: its core is the unchanged production root UorMcp.Fixture.fixtureRun, its one host effect is the tool-call counter that fills the tool-call section of the request frame, its listener is bound to 127.0.0.1, and its binding crate answers each client's count of tools/call requests in the current window, not counting the request being served."

[[id]]
id = "CF-02"
level = "build"
suite = "conformance"
statement = "Every acceptance vector and every served vector of the declaration is the committed core package's own answer to the request it holds, byte for byte, as the HTTP adapter frames the request and serializes the answer, so the declaration cannot disagree with the core it names."

[[id]]
id = "CF-03"
level = "build"
suite = "conformance"
statement = "The pinned conformance suite's server runner, at specification revision 2026-07-28 with the frozen requirements file, is run over loopback against the served conformance build and its verdict is read from the per-scenario checks: each of the 37 required and the 13 not-scored server scenarios is listed with its checks, and a scenario that produced no check, no passing check or any failing check is reported by name with the suite's own diagnostic. The job passes only when the set of failing scenarios equals the set that conformance/waiting.json lists, each entry naming its issue or pull request: a failing scenario that is not listed, a listed scenario that does not fail, and an entry that names neither fail the job, and a listed scenario stays a failure in the report and is never counted among the scenarios passing."

[[id]]
id = "CF-04"
level = "build"
suite = "conformance"
statement = "Every JSON-RPC message of the transcripts recorded during that run, each request, each result, each error and each event of a stream, validates against the pinned 2026-07-28 schema.json, a response against the definition of the request it answers, and a body that is not a JSON-RPC message is a failure and not a skipped message."

[[id]]
id = "CF-05"
level = "build"
suite = "conformance"
statement = "A defect planted in the core makes the oracle run fail with the suite's own diagnostic: the verdict logic names the failing scenario and check, and a run whose scenario produced no checks or only skipped ones is not a pass, and a listed scenario that starts to pass or a failure that is not listed fails the run."

[[id]]
id = "CF-06"
level = "build"
suite = "conformance"
statement = "The core artifact the conformance build produced is recorded by digest: the exported package's name, version and file digests, the source and semantic IDs it was exported from and the compiler that exported it, in a record that a rebuild must reproduce, so a consumer can check that it links the same core."

[[id]]
id = "CF-07"
level = "build"
suite = "conformance"
statement = "Each pin of the oracle run is written once and agrees with the authority record that names it: the PrismPM revision, the conformance suite commit, the SHA-256 of the frozen requirements file and the scenario sets it lists, and the specification schema's digest."

[[id]]
id = "CF-08"
level = "build"
suite = "conformance"
statement = "The workspace test gate needs neither node nor the installed conformance suite: every test that runs a node oracle or reads the installed suite is ignored with a reason that names the conformance job, the conformance job runs those tests with --ignored and fails unless every one of them ran and passed, and a test of the workspace that needs node or the suite without being ignored is refused."

# A provider requests a host effect as a typed outcome (issue #39): PE-01..PE-09.

[[id]]
id = "PE-01"
level = "build"
suite = "provider-effects"
statement = "A provider asks for a host effect with a typed outcome and not with a result: CallOutcome, ReadOutcome and PromptOutcome each have a constructor perform that carries one effect request, the tag of the effect and its payload bytes, Extension.answerOf turns each of the three into the provider refusal effectRequested with that request unchanged, and no result body, content block or text carries the request, so no marker can collide with the content of a result."

[[id]]
id = "PE-02"
level = "build"
suite = "provider-effects"
statement = "The step serve reads the turn PrismPM's replay driver writes (a length-prefixed request frame, the count of completed effects, and for each its four-byte tag and a length-prefixed outcome) and writes the step the driver reads (the word 0 and the response frame when done, the word 1, the four-byte tag and the payload to perform an effect), every word four bytes big-endian; a turn that is cut short or has bytes after its last outcome is answered done with the internal-error response frame that the byte serve writes for a frame it cannot read, and never performs."

[[id]]
id = "PE-03"
level = "build"
suite = "provider-effects"
statement = "A provider that requests an effect through a call, a read or a prompt reaches the root as a typed perform step, and the same request replayed with the outcome of that effect is answered done with the final response: the provider receives the completed effects of the turn in the order they were performed, a provider that needs two effects in turn requests the second only after the first outcome is in the log, an outcome of another tag than the provider requested is an internal error and not another effect, and no marker occurs in any result."

[[id]]
id = "PE-04"
level = "build"
suite = "provider-effects"
statement = "Every check the core runs before it calls the provider still runs first, so a request that fails one performs no effect: a request refused by the transport gate, a method other than POST, a body that is not JSON or not a JSON-RPC request, an unsupported protocol version, a missing or differing header, a missing or malformed _meta, a method the provider does not offer, params that do not decode, a tools/call past the rate limit and a tools/call whose arguments fail the input schema are each answered done with the refusal or result the byte serve gives, with no effect requested; kernel-checked theorems state that the answer of the provider does not enter the step of the refused cases."

[[id]]
id = "PE-05"
level = "build"
suite = "provider-effects"
statement = "The step serve and the byte serve agree whenever no effect is requested: the step of a turn with no completed effect over a request that the provider answers without an effect is done with exactly the response frame the byte serve writes, for every request of the lifecycle, tools, resources and transport vectors against the fixture provider, and a kernel-checked theorem states that a step is perform only when the handled request ended in an effect request."

[[id]]
id = "PE-06"
level = "build"
suite = "provider-effects"
statement = "The byte serve never performs: a provider that requests an effect through the byte serve is answered with the internal-error refusal, JSON-RPC code -32603 and HTTP status 500, with no data member, so the request is not disclosed and an effect-free server is not left waiting; the refusal is typed (ProviderRefusal.effectRequested) and kernel-checked theorems state its code, its status and its message."

[[id]]
id = "PE-07"
level = "build"
suite = "provider-effects"
statement = "The tag of a step is the four-byte tag of PrismPM's step encoding: a provider that requests a tag that does not fit thirty-two bits is answered done with the internal-error response and the step never wraps the tag modulo 2^32 into another effect."

[[id]]
id = "PE-08"
level = "build"
suite = "provider-effects"
statement = "The kernel checks the laws of the step: the step of a done response is the word 0 followed by the response, the step of a perform is the word 1, the tag and the payload, a turn written by the encoder is read back as the same request and the same completed effects, a refused check never reaches the provider, and a step is done exactly when the handled request did not end in an effect request."

[[id]]
id = "PE-09"
level = "build"
suite = "provider-effects"
statement = "The conformance fixture requests no effect: the fixture provider and the root fixtureRun import neither the effect module nor the step serve, every request of the committed vectors is answered done by the step serve of the fixture provider, and the conformance build still names fixtureRun, so its core identity moves only with the source and semantic IDs and the program of the modules it imports."
