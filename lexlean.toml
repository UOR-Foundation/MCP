spec = "lexlean/project/1"
name = "mcp-core"
language = "1.2"
module_prefix = "UorMcp"
source_roots = ["src"]
entrypoints = ["src/Decode.lex.tex", "src/Dispatch.lex.tex", "src/Envelope.lex.tex", "src/Extension.lex.tex", "src/JsonCodec.lex.tex", "src/JsonExamples.lex.tex", "src/JsonGate.lex.tex", "src/JsonRead.lex.tex", "src/JsonRoundTrip.lex.tex", "src/JsonText.lex.tex", "src/JsonWrite.lex.tex", "src/Methods.lex.tex", "src/Refusal.lex.tex", "src/Utf8.lex.tex", "src/Validation.lex.tex"]
build_root = ".lexlean"
lockfile = "lexlean.lock"
lean_workspace = "."
lean_toolchain = "leanprover/lean4:v4.32.1"

[[lexicon_source]]
package = "lexlean.std.bool"
kind = "builtin"

[[lexicon_source]]
package = "lexlean.std.nat"
kind = "builtin"

[[lexicon_source]]
package = "mcp.core"
kind = "path"
path = "language/mcp.core"

[limits]
max_file_bytes = 4194304
max_total_source_bytes = 67108864
max_primitive_atoms = 2000000
max_token_lattice_edges = 4000000
max_parse_states = 4000000
max_ir_nodes = 2000000
max_scope_depth = 1024
max_import_depth = 128
max_diagnostics = 256
max_child_output_bytes = 16777216
child_timeout_ms = 300000
