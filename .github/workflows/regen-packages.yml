# Scratch workflow: regenerate the exported packages on a GitHub runner.
# Read-only; uploads one artifact; never pushes.
name: regen-packages

on:
  push:
    branches: [claude/mcp-12-regen]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  ELAN_VERSION: v4.2.4
  ELAN_SHA256: 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  regen:
    name: regen / ${{ matrix.crate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        crate: [json-oracle, lifecycle-oracle]
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read the pinned LexLean revision
        id: pin
        run: |
          . .github/lexlean-ci/lib.sh
          gate "read the LexLean pin" output_pin
      - name: Restore lexlean built at the pinned revision
        id: lexlean-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.lexlean-bin
          key: lexlean-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin.outputs.rev }}
      - name: Install the pinned Rust toolchain
        if: steps.lexlean-cache.outputs.cache-hit != 'true'
        run: |
          . .github/lexlean-ci/lib.sh
          gate "install Rust" install_rust
      - name: Install lexlean at the pinned revision
        run: |
          . .github/lexlean-ci/lib.sh
          gate "install lexlean" install_lexlean
      - name: Restore the Lean toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.elan/toolchains
          key: lean-${{ runner.os }}-${{ runner.arch }}-${{ env.ELAN_VERSION }}-${{ hashFiles('lean-toolchain') }}
      - name: Install elan
        run: |
          . .github/lexlean-ci/lib.sh
          gate "install elan" install_elan
      - name: Install the Lean toolchain
        run: |
          . .github/lexlean-ci/lib.sh
          gate "install Lean" install_lean
      - name: Build the export
        run: |
          . .github/lexlean-ci/lib.sh
          rm -rf .lexlean/production
          gate "production build" lexlean --color never production build --request crates/${{ matrix.crate }}/generated/request.json
          mkdir -p out/${{ matrix.crate }}
          cp -r .lexlean/production/*/packages/rust-std/* out/${{ matrix.crate }}/
          cp crates/${{ matrix.crate }}/generated/request.json out/${{ matrix.crate }}/request.json
          ls out/${{ matrix.crate }}
      - name: Upload the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: packages-${{ matrix.crate }}
          path: out/${{ matrix.crate }}
          if-no-files-found: error
