# Project gates that run without the PrismPM SDK. The template's bootstrap
# workflow stays the authority and is unchanged; this one gives every pull request
# the LexLean and cargo evidence that `just vv` will later include, ahead of the
# SDK binding. Each step reports a failure as an annotation holding the last
# lines of its output (.github/lexlean-ci/lib.sh, `gate`).
name: lexlean

on:
  push:
    branches: [main]
  pull_request:
  # Merge-queue groups for main get the same gates, so a queued pull request
  # is checked against the main it will land on.
  merge_group:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lexlean-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # elan, installed from its release archive after its SHA-256 is checked.
  ELAN_VERSION: v4.2.4
  ELAN_SHA256: 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
  # cargo-deny, the same way (the x86_64 musl archive).
  CARGO_DENY_VERSION: 0.20.2
  CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  prepare:
    name: prepare / compiler and toolchains
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read the pinned LexLean revision
        id: pin
        run: |
          . .github/lexlean-ci/lib.sh
          gate "read the LexLean pin" output_pin
      - name: Restore lexlean built at the pinned revision
        id: lexlean-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.lexlean-bin
          key: lexlean-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin.outputs.rev }}
      - name: Install the pinned Rust toolchain
        if: steps.lexlean-cache.outputs.cache-hit != 'true'
        run: |
          . .github/lexlean-ci/lib.sh
          gate "install Rust" install_rust
      - name: Install lexlean at the pinned revision
        run: |
          . .github/lexlean-ci/lib.sh
          gate "install lexlean" install_lexlean
      - name: Save lexlean built at the pinned revision
        if: steps.lexlean-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.lexlean-bin
          key: lexlean-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin.outputs.rev }}
      - name: The compiler is the one lexlean.lock was made with
        run: |
          . .github/lexlean-ci/lib.sh
          gate "compiler semantics against lexlean.lock" compiler_semantics_agrees
      - name: Restore the Lean toolchain
        id: lean-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.elan/toolchains
          key: lean-${{ runner.os }}-${{ runner.arch }}-${{ env.ELAN_VERSION }}-${{ hashFiles('lean-toolchain') }}
      - name: Install elan
        run: |
          . .github/lexlean-ci/lib.sh
          gate "install elan" install_elan
      - name: Install the Lean toolchain
        run: |
          . .github/lexlean-ci/lib.sh
          gate "install Lean" install_lean
      - name: Save the Lean toolchain
        if: steps.lean-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.elan/toolchains
          key: lean-${{ runner.os }}-${{ runner.arch }}-${{ env.ELAN_VERSION }}-${{ hashFiles('lean-toolchain') }}
      - name: List the gates that need lexlean
        id: matrix
        run: |
          . .github/lexlean-ci/lib.sh
          gate "list the production requests" output_matrix

  cargo:
    name: cargo / fmt clippy audits deny test
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: |
          . .github/lexlean-ci/lib.sh
          gate "install Rust" install_rust
      - name: Restore the registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: registry-${{ runner.os }}-
      - name: 1a. cargo fmt
        run: |
          . .github/lexlean-ci/lib.sh
          gate "cargo fmt" cargo fmt --all -- --check
      - name: 1b. cargo clippy
        run: |
          . .github/lexlean-ci/lib.sh
          gate "cargo clippy" cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: 1c. every optional feature compiles
        run: |
          . .github/lexlean-ci/lib.sh
          gate "cargo check --all-features" cargo check --workspace --all-features --all-targets --locked
      - name: 2a. check-model (R1)
        run: |
          . .github/lexlean-ci/lib.sh
          gate "xtask check-model" cargo xtask check-model
      - name: 2b. audit-limits (R5)
        run: |
          . .github/lexlean-ci/lib.sh
          gate "xtask audit-limits" cargo xtask audit-limits
      - name: 2c. audit-deferral (R4)
        run: |
          . .github/lexlean-ci/lib.sh
          gate "xtask audit-deferral" cargo xtask audit-deferral
      - name: 2d. audit-dependency-updates
        run: |
          . .github/lexlean-ci/lib.sh
          gate "xtask audit-dependency-updates" cargo xtask audit-dependency-updates
      - name: 3a. Install cargo-deny
        run: |
          . .github/lexlean-ci/lib.sh
          gate "install cargo-deny" install_cargo_deny
      - name: 3b. cargo deny (R6)
        run: |
          . .github/lexlean-ci/lib.sh
          gate "cargo deny" cargo deny --all-features check
      - name: 6. cargo test, as the SDK gate runs it (no installed conformance suite)
        run: |
          . .github/lexlean-ci/lib.sh
          gate "cargo test" env -u MCP_CONFORMANCE_SUITE_ROOT cargo test --workspace --locked --no-fail-fast

  lexlean:
    name: lexlean / ${{ matrix.label }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read the pinned LexLean revision
        id: pin
        run: |
          . .github/lexlean-ci/lib.sh
          gate "read the LexLean pin" output_pin
      - name: Restore lexlean built at the pinned revision
        id: lexlean-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.lexlean-bin
          key: lexlean-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin.outputs.rev }}
      - name: Install the pinned Rust toolchain
        if: steps.lexlean-cache.outputs.cache-hit != 'true'
        run: |
          . .github/lexlean-ci/lib.sh
          gate "install Rust" install_rust
      - name: Install lexlean at the pinned revision
        run: |
          . .github/lexlean-ci/lib.sh
          gate "install lexlean" install_lexlean
      - name: Restore the Lean toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.elan/toolchains
          key: lean-${{ runner.os }}-${{ runner.arch }}-${{ env.ELAN_VERSION }}-${{ hashFiles('lean-toolchain') }}
      - name: Install elan
        run: |
          . .github/lexlean-ci/lib.sh
          gate "install elan" install_elan
      - name: Install the Lean toolchain
        run: |
          . .github/lexlean-ci/lib.sh
          gate "install Lean" install_lean
      - name: 4a. lexlean fmt --check
        if: matrix.kind == 'verify'
        run: |
          . .github/lexlean-ci/lib.sh
          gate "lexlean fmt --check" lexlean --color never fmt --check
      - name: 4b. lexlean lock --check
        if: matrix.kind == 'verify'
        run: |
          . .github/lexlean-ci/lib.sh
          gate "lexlean lock --check" lexlean --color never lock --check
      - name: 4c. lexlean check
        if: matrix.kind == 'verify'
        run: |
          . .github/lexlean-ci/lib.sh
          gate "lexlean check" lexlean --color never check
      - name: 4d. lexlean verify
        if: matrix.kind == 'verify'
        run: |
          . .github/lexlean-ci/lib.sh
          gate "lexlean verify" lexlean --color never verify
      - name: 5. the committed packages are the export of their sources
        if: matrix.kind == 'export'
        env:
          REQUEST: ${{ matrix.request }}
        run: |
          . .github/lexlean-ci/lib.sh
          gate "export of $REQUEST" export_matches "$REQUEST"

  conformance:
    name: conformance / server suite and schema oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read the pinned PrismPM and LexLean revisions
        id: pin
        run: |
          . .github/lexlean-ci/lib.sh
          gate "read the PrismPM pin" output_prismpm_pin
      - name: Restore prismpm built at the pinned revision
        id: prismpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.prismpm-bin
          key: prismpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin.outputs.rev }}-${{ steps.pin.outputs.lexlean }}
      - name: Install the pinned Rust toolchain
        run: |
          . .github/lexlean-ci/lib.sh
          gate "install Rust" install_rust
      - name: Install prismpm at the pinned revision, built with the pinned LexLean
        run: |
          . .github/lexlean-ci/lib.sh
          gate "install prismpm" install_prismpm
      - name: Save prismpm built at the pinned revision
        if: steps.prismpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.prismpm-bin
          key: prismpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin.outputs.rev }}-${{ steps.pin.outputs.lexlean }}
      - name: Restore the Lean toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.elan/toolchains
          key: lean-${{ runner.os }}-${{ runner.arch }}-${{ env.ELAN_VERSION }}-${{ hashFiles('lean-toolchain') }}
      - name: Install elan
        run: |
          . .github/lexlean-ci/lib.sh
          gate "install elan" install_elan
      - name: Install the Lean toolchain
        run: |
          . .github/lexlean-ci/lib.sh
          gate "install Lean" install_lean
      - name: 7a. the copies of the PrismPM files are the files at the pinned revision
        run: |
          . .github/lexlean-ci/lib.sh
          gate "sdk copies agree" sdk_copies_agree
      - name: 7b. prismpm build of the conformance server application
        id: build
        run: |
          . .github/lexlean-ci/lib.sh
          gate "prismpm build" build_conformance
      - name: 7c. the core is the one core-identity.json records
        run: |
          . .github/lexlean-ci/lib.sh
          gate "core identity" check_core_identity
      - name: 7d. the consumer workspace builds and its binding passes its tests
        working-directory: conformance
        run: |
          . ../.github/lexlean-ci/lib.sh
          gate "cargo build --release" cargo build --release --locked
          gate "cargo test" cargo test --locked -p mcp-binding
          gate "cargo fmt" cargo fmt -p mcp-binding -- --check
          gate "cargo clippy" cargo clippy --locked -p mcp-binding --no-deps --all-targets -- -D warnings
      - name: 8a. node satisfies the conformance suite
        run: |
          . .github/lexlean-ci/lib.sh
          gate "node version" check_node
      - name: 8b. Install the pinned conformance suite
        run: |
          . .github/lexlean-ci/lib.sh
          gate "install the conformance suite" install_suite "$RUNNER_TEMP/suite"
      - name: 8c. the oracle scripts pass their own tests
        run: |
          . .github/lexlean-ci/lib.sh
          gate "oracle tests" node --test conformance/oracle/test/*.test.mjs
      - name: 8d. the oracle tests the workspace gate ignores
        run: |
          . .github/lexlean-ci/lib.sh
          gate "oracle tests (cargo test -- --ignored)" run_oracle_tests
      - name: 9a. server suite over the served build
        id: suite
        run: |
          . .github/lexlean-ci/lib.sh
          gate "server suite" run_server_suite
      - name: 9b. schema oracle over the recorded transcript
        if: always() && steps.build.outcome == 'success'
        run: |
          . .github/lexlean-ci/lib.sh
          gate "schema oracle" run_schema_oracle
      - name: 9c. the per-scenario table
        if: always() && steps.build.outcome == 'success'
        run: |
          . .github/lexlean-ci/lib.sh
          gate "scenario table" conformance_summary
